<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Update Profile | EduClass</title>
  <link rel="stylesheet" href="profile.css">
</head>
<body>

<div class="profile-container">

  <div class="profile-card">

    <h2>Student Profile</h2>

    <img id="profilePhoto" class="profile-img">
    <input type="file" name="photo" id="photoInput">

    <form id="profileForm">

      <label>Name</label>
      <input id="nameInput" name="name">

      <label>Email</label>
      <input id="emailInput" name="email">

      <label>Password</label>
      <input id="passwordInput" name="password">

      <label>Class</label>
      <input id="classInput" name="className">

      <label>Class Code</label>
      <input id="classCodeInput" name="classCode">

      <button type="submit">Save Profile</button>

    </form>

  </div>

</div>



<script src="profile.js"></script>
</body>
</html>
