<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JEE Preparation | EduClass</title>

    <!-- Global CSS -->
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/buttons.css">

    <!-- Page CSS -->
    <link rel="stylesheet" href="jee-neet.css">
</head>
<body>

<div class="app-container">

    <!-- Sidebar -->
    <div id="sidebar"></div>

    <div class="main-content">

        <!-- Header -->
        <div id="header"></div>

        <!-- Content -->
        <div class="content">
            <h2>JEE Preparation</h2>
            <p class="subtitle">Engineering Entrance Exam Resources</p>

            <div class="prep-grid">

                <div class="prep-card">
                    <h3>Physics</h3>
                    <p>Chapter-wise notes & formulas</p>
                    <button class="btn-primary">View Notes</button>
                </div>

                <div class="prep-card">
                    <h3>Chemistry</h3>
                    <p>Organic, Inorganic & Physical</p>
                    <button class="btn-primary">View Notes</button>
                </div>

                <div class="prep-card">
                    <h3>Mathematics</h3>
                    <p>Important problems & shortcuts</p>
                    <button class="btn-primary">View Notes</button>
                </div>

                <div class="prep-card highlight">
                    <h3>Mock Tests</h3>
                    <p>JEE pattern MCQ tests</p>
                    <button class="btn-outline">Start Test</button>
                </div>

            </div>
        </div>

    </div>

    <!-- Sticky Notes -->
    <div id="sticky-notes"></div>

</div>

<!-- Global JS -->
<script src="../assets/js/common.js"></script>

<!-- Page JS -->
<script src="jee-neet.js"></script>

</body>
</html>
