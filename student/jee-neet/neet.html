<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEET Preparation | EduClass</title>

    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/buttons.css">
    <link rel="stylesheet" href="jee-neet.css">
</head>
<body>

<div class="app-container">

    <div id="sidebar"></div>

    <div class="main-content">
        <div id="header"></div>

        <div class="content">
            <h2>NEET Preparation</h2>
            <p class="subtitle">Medical Entrance Exam Resources</p>

            <div class="prep-grid">

                <div class="prep-card">
                    <h3>Biology</h3>
                    <p>NCERT based concepts</p>
                    <button class="btn-primary">View Notes</button>
                </div>

                <div class="prep-card">
                    <h3>Physics</h3>
                    <p>Numericals & theory</p>
                    <button class="btn-primary">View Notes</button>
                </div>

                <div class="prep-card">
                    <h3>Chemistry</h3>
                    <p>Important reactions</p>
                    <button class="btn-primary">View Notes</button>
                </div>

                <div class="prep-card highlight">
                    <h3>Mock Tests</h3>
                    <p>NEET exam pattern tests</p>
                    <button class="btn-outline">Start Test</button>
                </div>

            </div>
        </div>
    </div>

    <div id="sticky-notes"></div>

</div>

<script src="../assets/js/common.js"></script>
<script src="jee-neet.js"></script>
</body>
</html>
