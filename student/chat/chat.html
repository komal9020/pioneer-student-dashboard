<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chat | EduClass</title>

<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/layout.css">
<link rel="stylesheet" href="../assets/css/sticky-notes.css">
<link rel="stylesheet" href="chat.css">
</head>

<body>

<div class="app-container">

  <!-- Sidebar -->
  <div id="sidebar"></div>

  <div class="main-content">

    <!-- Header -->
    <div id="header"></div>

    <!-- PAGE CONTENT -->
    <div class="content">

      <h2 class="page-title">Chat with Teachers</h2>

      <div class="chat-main">

        <!-- LEFT PANEL -->
        <div class="teachers-panel" id="teacherList"></div>

        <!-- RIGHT PANEL -->
        <div class="conversation-panel">

          <div class="conversation-header" id="chatHeader">
            Select a teacher
          </div>

          <div id="messages" class="messages"></div>

          <div class="chat-input">
            <input type="text" id="messageInput" placeholder="Type your message...">
            <button onclick="sendMessage()">➤</button>
          </div>

        </div>

      </div>

    </div>

    <!-- Footer -->
    <div id="footer"></div>

  </div>

  <!-- Sticky Notes -->
  <div id="sticky-notes"></div>

</div>


<!-- Load Components -->
<script>
fetch("../components/sidebar.html")
.then(res => res.text())
.then(html => document.getElementById("sidebar").innerHTML = html);

fetch("../components/header.html")
.then(res => res.text())
.then(html => document.getElementById("header").innerHTML = html);

fetch("../components/footer.html")
.then(res => res.text())
.then(html => document.getElementById("footer").innerHTML = html);

fetch("../components/sticky-notes.html")
.then(res => res.text())
.then(html => document.getElementById("sticky-notes").innerHTML = html);
</script>

<script src="chat.js"></script>

</body>
</html>
