<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Result Details | EduClass</title>

    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/buttons.css">
    <link rel="stylesheet" href="results.css">
</head>
<body>

<div class="app-container">

    <div id="sidebar"></div>

    <div class="main-content">
        <div id="header"></div>

        <div class="content">
            <h2>Mathematics – Unit Test 1</h2>

            <div class="result-summary">
                <p><strong>Total Marks:</strong> 100</p>
                <p><strong>Marks Obtained:</strong> 78</p>
                <p><strong>Status:</strong> <span class="pass">Pass</span></p>
            </div>

            <div class="marks-breakup">
                <h3>Marks Breakdown</h3>
                <ul>
                    <li>MCQs: 40 / 50</li>
                    <li>Short Answers: 18 / 25</li>
                    <li>Long Answers: 20 / 25</li>
                </ul>
            </div>

            <a href="results.html" class="btn-outline">← Back to Results</a>
        </div>
    </div>

    <div id="sticky-notes"></div>

</div>

<script src="../assets/js/common.js"></script>
</body>
</html>
