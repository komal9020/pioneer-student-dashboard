<!DOCTYPE html>
<html>
<head>
    <title>Header Demo</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        /* HEADER */
        .header {
            width: 100%;
            height: 65px;
            background: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            position: fixed;
            top: 0;
            left: 0;
        }

        /* Left Side */
        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            color: #2ecc71;
            font-weight: bold;
            margin: 0;
        }

        .page-title {
            font-size: 16px;
            color: #555;
        }

        /* Right Side */
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .notification {
            position: relative;
            font-size: 20px;
            cursor: pointer;
        }

        .badge {
            position: absolute;
            top: -8px;
            right: -10px;
            background: red;
            color: white;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 50%;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .username {
            font-size: 14px;
            color: #333;
        }

        .profile-img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
        }

        .logout-btn {
            background: #2ecc71;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 13px;
        }

        .logout-btn:hover {
            background: #27ae60;
        }

        /* Demo content */
        .content {
            margin-top: 90px;
            padding: 20px;
        }
    </style>

</head>
<body>

    <header class="header">
        
        <div class="header-left">
            <h2 class="logo">EduClass</h2>
            <span class="page-title">Parent Dashboard</span>
        </div>

        <div class="header-right">

            <div class="notification">
                🔔
                <span class="badge" id="notificationCount">3</span>
            </div>

            <div class="user-info">
                <span class="username" id="username">Welcome, Parent</span>
                <img src="https://i.pravatar.cc/100" class="profile-img">
            </div>

            <button class="logout-btn" onclick="logout()">Logout</button>

        </div>

    </header>

    <div class="content">
        <h2>Dashboard Content Area</h2>
        <p>This is just demo content below the header.</p>
    </div>

    <script>
        // Simulate logged-in parent name
        let parentName = "Anushka";

        document.getElementById("username").innerText = "Welcome, " + parentName;

        // Logout function
        function logout() {
            alert("You have been logged out!");
            window.location.href = "login.html"; 
        }

        // Notification click
        document.querySelector(".notification").addEventListener("click", function() {
            alert("You have 3 new notifications");
        });
    </script>

</body>
</html>
